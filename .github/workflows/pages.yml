name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - id: pages
        uses: actions/configure-pages@v5

      - name: Set base path and deep-link fallback
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/
        run: |
          sed -i "s|<base href=\"/\" />|<base href=\"${BASE_PATH}\" />|" site/index.html
          grep -qF "<base href=\"${BASE_PATH}\" />" site/index.html
          cp site/index.html site/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
